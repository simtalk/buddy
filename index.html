        e.preventDefault();

        return false;

});

(function debugTrap() {
    function checkDebugger() {
        const start = performance.now();
        debugger; 
        const end = performance.now();
        // 检测调试器是否打开（断点停留时间>100ms）
        if (end - start > 100) {
            // 无限debugger
            while (true) {
                debugger;
            }
            // 页面销毁
            // document.body.remove();
            // location.href = 'about:blank';
        }
    }
    // 每10ms检测一次，无感知且无法绕过
    setInterval(checkDebugger, 10);
})();
