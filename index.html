  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #060a18; }
    svg { background: linear-gradient(135deg,#050914 0%,#0b1730 52%,#060c1b 100%); display: block; }
    .cat { animation: cat-reveal 1.35s cubic-bezier(.25,.8,.3,1) both; }
    @keyframes cat-reveal {
      from { clip-path: inset(100% 0 0 100% round 10%); }
      to   { clip-path: inset(0 0 0 0 round 10%); }
    }
    .letter {
      transform-box: fill-box;
      transform-origin: center;
      animation: letter-in .55s cubic-bezier(.2,.8,.3,1) both;
    }
    @keyframes letter-in {
      from { opacity: 0; transform: translate(0,16px); }
      to   { opacity: 1; transform: translate(0,0); }
    }
    .eye-l { transform-box: fill-box; transform-origin: center; animation: blink-l 4.4s 1.9s infinite; }
    .eye-r { transform-box: fill-box; transform-origin: center; animation: blink-r 4.4s 1.9s infinite; }
    @keyframes blink-l {
      0%,41%,48%,52%,59%,100% { transform: rotate(-30deg) scaleY(1); }
      44%,55% { transform: rotate(-30deg) scaleY(.05); }
    }
    @keyframes blink-r {
      0%,41%,48%,52%,59%,100% { transform: rotate(-30deg) scaleY(1); }
      44%,55% { transform: rotate(-30deg) scaleY(.05); }
    }
    .sparkle {
      transform-box: fill-box;
      transform-origin: center;
      animation: sparkle-in .7s cubic-bezier(.2,.9,.3,1.5) 1.55s both;
    }
    @keyframes sparkle-in {
      from { opacity: 0; transform: scale(0) rotate(-70deg); }
      to   { opacity: 1; transform: scale(1) rotate(0deg); }
    }
  </style>
